services:
  - type: web
    name: cloudnex-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PROJECT_NAME
        value: "CLOUDNEX 2K26"
      - key: DATABASE_NAME
        value: "cloudnex"
      - key: MONGODB_URI
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DEFAULT_ADMIN_USERNAME
        value: "cloudnex2k26"
      - key: DEFAULT_ADMIN_EMAIL
        value: "cloudnex2k26@gmail.com"
      - key: DEFAULT_ADMIN_PASSWORD
        value: "Cloudnex@2k26.cc.gmu"
